[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-pinn"
version = "0.1.0"
description = "Production-quality D-BJH-based PINN scaffolding."
requires-python = ">=3.9"
dependencies = ["tensorflow>=2.13"]

[project.scripts]
train-pinn = "pinn.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
